<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <title>Perde — Sahneye Katıl</title>
  <meta name="description" content="Perde daveti." />
  <meta property="og:title" content="🎭 Perde Daveti" />
  <meta property="og:description" content="Perde davetine katıl." />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="invite-body">
  <div class="invite-card">
    <div class="invite-icon">🎥</div>
    <h1 class="invite-title">Perde Sahnesi</h1>
    <p class="invite-text">Davet edildin! Adını gir ve sahneye katıl.</p>
    <input id="name" class="invite-input" type="text" maxlength="20" placeholder="Adınız..." autocomplete="off" autofocus />
    <button id="join" class="btn btn-primary invite-btn">Sahneye Katıl →</button>
    <p class="invite-hint">5 saniye içinde ad girmezsen Misafir olarak girersin.</p>
  </div>
  <script>
    const input = document.getElementById('name');
    const btn = document.getElementById('join');
    const guestSuffix = Math.random().toString(36).slice(2, 6).toUpperCase();
    const defaultGuestName = 'Misafir-' + guestSuffix;

    function join() {
      const v = (input.value || '').trim() || defaultGuestName;
      // ODA KİMLİĞİNİ TAŞI. Eskiden yalnız username gönderiliyordu; room.js
      // parametre yoksa sabit 'PERDE' odasına düşüyor ve linkten girenlerin
      // HEPSİ o hayalet odada buluşuyordu: birbirlerini görüyorlar ama ev
      // sahibi kendi odasında yalnız kalıyor — sohbet geçmiyor, odaya
      // gönderilen video görünmüyordu (telefonda ölçüldü: sunucuda iki oda,
      // biri gerçek oda biri 'PERDE').
      const gelen = new URLSearchParams(location.search);
      const hedef = new URLSearchParams();
      const oda = gelen.get('room');
      if (oda) hedef.set('room', oda);
      hedef.set('username', v);
      window.location.href = '/room.html?' + hedef.toString();
    }

    btn.addEventListener('click', join);
    input.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') join();
    });

    // 5 saniye sonra otomatik katıl
    const countdown = setTimeout(join, 5000);
    input.addEventListener('focus', function() { clearTimeout(countdown); });
  </script>
</body>
</html>
