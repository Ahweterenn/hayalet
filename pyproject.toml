[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hayalet"
version = "0.1.0"
description = "Dizipal için tarayıcısız (headless) Python CLI — m3u8 izleme ve indirme."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "curl-cffi>=0.15",
    "pycryptodome>=3.23",
    "questionary>=2.1",
    "m3u8>=6.0",
    "selectolax>=0.4",
    "rich>=15.0",
]

[project.optional-dependencies]
test = ["pytest>=8"]
# Perde (birlikte izleme) sunucusu. Android derlemesi bunlari build.gradle
# uzerinden kuruyordu; masaustunde `pip install -e ".[perde]"` olmadan
# hayalet.perde.server IMPORT EDILEMIYOR (olculdu) — hatayi ancak telefonda
# gorursun, o yuzden burada da dursun.
perde = [
    "python-socketio>=5.11",
    "simple-websocket>=1.0",
    "werkzeug>=3.0",
    "paramiko>=3.4",          # SSH ters tuneli (tunnel.py)
]

[project.scripts]
hayalet = "hayalet.cli:main"

[tool.setuptools.packages.find]
include = ["hayalet*"]
